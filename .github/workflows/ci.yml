name: Week 5 - CI and secure container publishing
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install flake8==7.1.2
      - run: python -m flake8 .
      - run: python -m unittest discover -s tests -v
      - name: Verify policy passes and deliberately rejects HIGH finding
        shell: bash
        run: |
          python ops.py gate fixtures/clean.json
          set +e
          python ops.py gate fixtures/high.json
          result=$?
          set -e
          test "$result" -eq 1
      - name: Run rollback model (simulation)
        run: python ops.py
  infrastructure-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=previous-week4/terraform fmt -check -recursive
      - run: terraform -chdir=previous-week4/terraform init -backend=false -input=false
      - run: terraform -chdir=previous-week4/terraform validate
  build-scan-publish:
    needs: [quality, infrastructure-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image name and validate release version
        id: vars
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == "tag" ]]; then
            version=$(python -c 'import os; from ops import release_version; print(release_version(os.environ["REF_NAME"]))')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: talented-ci:${{ github.sha }}
      - name: Start container and verify health
        shell: bash
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 talented-ci:${{ github.sha }}
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Scan exact local image and break on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: talented-ci:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Preserve scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: warn
      - name: Login to GHCR only for validated version tags
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image without rebuilding
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        shell: bash
        run: |
          docker tag talented-ci:${{ github.sha }} "$IMAGE:$VERSION"
          docker tag talented-ci:${{ github.sha }} "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
